

# MeetFree - LOCAL TESTING Docker Compose (HTTP only, no SSL)
# Usage: docker-compose -f docker-compose.local.yml up --build
# App:   http://localhost

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meetfree:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: backend/.env.local
    environment:
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: development
      # FIX: ensures config.py and auth.py are importable from server.py
      # Python sees /app/backend on its path, so `from config import cfg` works
      PYTHONPATH: /app/backend
    depends_on:
      redis:
        condition: service_healthy
    command: >
      gunicorn
        --worker-class eventlet
        --workers 1
        --bind 0.0.0.0:5000
        --timeout 120
        --reload
        --log-level debug
        --access-logfile -
        --error-logfile -
        backend.server:app
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    ports:
      - "5000:5000"
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - meetfree

volumes:
  redis_data: