

# MeetFree — LOCAL TESTING (hotfix branch)
#
# Fixes in this version:
#   - MySQL health check updated to be more reliable on Windows/Docker Desktop
#   - MYSQL_ROOT_PASSWORD explicitly set (prevents empty password warning)
#   - start_period increased to 60s to give MySQL enough time on first init
#   - Volume name matches what docker volume rm expects

services:

  mysql:
    image: mysql:8.0
    container_name: meetfree-mysql-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_local_password_123
      MYSQL_DATABASE:      meetfree
      MYSQL_USER:          meetfree
      MYSQL_PASSWORD:      meetfree_local_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # FIX: Use root credentials for the health check ping.
      # The meetfree user is created AFTER root initialises, so using
      # root for the ping avoids a race condition where the user
      # doesn't exist yet when the first health check fires.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_local_password_123"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: meetfree-redis-1
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meetfree:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetfree-1
    restart: unless-stopped
    env_file: backend/.env.local
    environment:
      # These override .env.local for Docker context
      REDIS_URL:      redis://redis:6379/0
      MYSQL_HOST:     mysql
      MYSQL_PORT:     "3306"
      MYSQL_USER:     meetfree
      MYSQL_PASSWORD: meetfree_local_password
      MYSQL_DATABASE: meetfree
      MYSQL_ENABLED:  "true"
      FLASK_ENV:      development
      PYTHONPATH:     /app/backend
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: >
      gunicorn
        --worker-class eventlet
        --workers 1
        --bind 0.0.0.0:5000
        --timeout 120
        --reload
        --log-level debug
        --access-logfile -
        --error-logfile -
        backend.server:app
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    ports:
      - "5000:5000"
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: webrtc-nginx-1
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - meetfree

volumes:
  mysql_data: