version: '3.9'

# MeetFree — LOCAL TESTING (feature-dev branch)
# Adds MySQL service for chat history, room passwords, host mute persistence.
# Usage: docker-compose -f docker-compose.local.yml up --build
# App:   http://localhost

services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_local
      MYSQL_DATABASE:      meetfree
      MYSQL_USER:          meetfree
      MYSQL_PASSWORD:      meetfree_local_password
    ports:
      - "3306:3306"   # expose for inspection with MySQL Workbench or DBeaver
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "meetfree", "-pmeetfree_local_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s   # MySQL takes a moment to initialise on first run

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meetfree:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: backend/.env.local
    environment:
      REDIS_URL:       redis://redis:6379/0
      MYSQL_HOST:      mysql
      MYSQL_PORT:      3306
      MYSQL_USER:      meetfree
      MYSQL_PASSWORD:  meetfree_local_password
      MYSQL_DATABASE:  meetfree
      MYSQL_ENABLED:   "true"
      FLASK_ENV:       development
      PYTHONPATH:      /app/backend
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: >
      gunicorn
        --worker-class eventlet
        --workers 1
        --bind 0.0.0.0:5000
        --timeout 120
        --reload
        --log-level debug
        --access-logfile -
        --error-logfile -
        backend.server:app
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    ports:
      - "5000:5000"
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - meetfree

volumes:
  mysql_data:
  redis_data: