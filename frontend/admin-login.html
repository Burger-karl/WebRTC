<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MeetFree Admin — Login</title>
  <link rel="stylesheet" href="/frontend/style.css"/>
</head>
<body class="landing-page">
  <div class="landing-container" style="max-width:420px">
    <div class="logo" style="justify-content:center;margin-bottom:1.5rem">
      <span class="logo-icon">📹</span>
      <span class="logo-text">MeetFree Admin</span>
    </div>

    <h1 style="font-size:1.6rem;text-align:center">Admin Login</h1>

    {% if expired %}
    <div class="error-banner" style="display:block;margin:1rem 0">
      Your session expired. Please log in again.
    </div>
    {% endif %}

    {% if error %}
    <div class="error-banner" style="display:block;margin:1rem 0">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login" class="room-form" style="flex-direction:column">
      <div class="form-group" style="width:100%">
        <label for="username" style="font-size:.85rem;color:var(--text-muted);font-weight:600">Username</label>
        <input type="text" id="username" name="username"
               placeholder="admin" autocomplete="username"
               required style="width:100%;padding:12px 16px;border-radius:10px;
               border:2px solid var(--border);background:var(--surface2);
               color:var(--text);font-size:.95rem;outline:none"/>
      </div>
      <div class="form-group" style="width:100%">
        <label for="password" style="font-size:.85rem;color:var(--text-muted);font-weight:600">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password"
               required style="width:100%;padding:12px 16px;border-radius:10px;
               border:2px solid var(--border);background:var(--surface2);
               color:var(--text);font-size:.95rem;outline:none"/>
      </div>
      <button type="submit" class="join-btn" style="width:100%;margin-top:.5rem">
        Sign In →
      </button>
    </form>

    <p style="text-align:center;margin-top:1rem;font-size:.8rem;color:var(--text-muted)">
      <a href="/" style="color:var(--text-muted)">← Back to MeetFree</a>
    </p>
  </div>
</body>
</html>
