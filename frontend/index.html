<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MeetFree — Unlimited Video Calls</title>
  <link rel="stylesheet" href="/frontend/style.css"/>
</head>
<body class="landing-page">

  <div class="landing-container">

    <div class="logo">
      <span class="logo-icon">📹</span>
      <span class="logo-text">MeetFree</span>
    </div>

    <!-- Pricing nav link -->
    <a href="/pricing" class="pricing-nav-link">View Plans & Pricing →</a>

    <h1>Video calls with no time limits</h1>
    <p class="subtitle">Self-hosted, peer-to-peer, unlimited. No downloads for guests.</p>

    <div id="errorBanner" class="error-banner hidden"></div>

    <div class="room-form">
      <input type="text"  id="nameInput"  placeholder="Your name"              maxlength="50"  autocomplete="name"  spellcheck="false"/>
      <input type="email" id="emailInput" placeholder="Your email (for billing)" maxlength="120" autocomplete="email" spellcheck="false"/>
      <input type="text"  id="roomInput"  placeholder="Room name (e.g. team-standup)" maxlength="80" autocomplete="off" spellcheck="false"/>
      <button id="joinBtn" onclick="joinRoom()">
        <span id="joinBtnText">Start or Join →</span>
        <span id="joinBtnSpinner" class="spinner hidden"></span>
      </button>
    </div>

    <p class="hint">
      Share a link: <code>meetfree.local/room/<strong>team-standup</strong></code>
    </p>

    <div class="features">
      <div class="feature"><span>🔒</span><span>JWT-secured rooms</span></div>
      <div class="feature"><span>🚪</span><span>Lobby waiting room</span></div>
      <div class="feature"><span>⏱️</span><span>Unlimited meeting time</span></div>
      <div class="feature"><span>💳</span><span>14-day free trial</span></div>
    </div>
  </div>

  <script>
    (function() {
      const p = new URLSearchParams(window.location.search);
      if (p.get('room'))  document.getElementById('roomInput').value  = p.get('room');
      if (p.get('name'))  document.getElementById('nameInput').value  = p.get('name');
      if (p.get('email')) document.getElementById('emailInput').value = p.get('email');
      if (p.get('error') === 'session_expired') {
        document.getElementById('errorBanner').textContent = 'Your session expired. Please sign in again.';
        document.getElementById('errorBanner').classList.remove('hidden');
      }
      document.getElementById('nameInput').focus();
    })();

    ['nameInput','emailInput','roomInput'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') joinRoom();
      });
    });

    async function joinRoom() {
      const name    = document.getElementById('nameInput').value.trim();
      const email   = document.getElementById('emailInput').value.trim();
      const rawRoom = document.getElementById('roomInput').value.trim();

      if (!name)    { showError('Please enter your name.');      return; }
      if (!rawRoom) { showError('Please enter a room name.');    return; }

      const room = rawRoom.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
      if (!room) { showError('Room name must contain letters or numbers.'); return; }

      setLoading(true);

      try {
        const res  = await fetch('/api/token', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ name, email, room }),
        });
        const data = await res.json();

        if (res.status === 402) {
          // Subscription expired — send to pricing page
          window.location.href = '/pricing?email=' + encodeURIComponent(email);
          return;
        }

        if (!res.ok) {
          showError(data.error || 'Could not enter room. Please try again.');
          setLoading(false);
          return;
        }

        sessionStorage.setItem('meetfree_token', data.token);
        sessionStorage.setItem('meetfree_ice',   JSON.stringify(data.iceServers));
        sessionStorage.setItem('meetfree_name',  name);
        sessionStorage.setItem('meetfree_email', email);
        sessionStorage.setItem('meetfree_room',  room);

        window.location.href = '/room/' + room;

      } catch (err) {
        showError('Network error. Is the server running?');
        setLoading(false);
      }
    }

    function showError(msg) {
      const b = document.getElementById('errorBanner');
      b.textContent = msg;
      b.classList.remove('hidden');
      setTimeout(() => b.classList.add('hidden'), 5000);
    }

    function setLoading(on) {
      document.getElementById('joinBtnText').classList.toggle('hidden', on);
      document.getElementById('joinBtnSpinner').classList.toggle('hidden', !on);
      document.getElementById('joinBtn').disabled = on;
    }
  </script>
</body>
</html>
