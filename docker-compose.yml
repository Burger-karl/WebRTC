

# MeetFree - PRODUCTION Docker Compose
# Usage: docker-compose up -d --build

services:

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meetfree:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      # FIX: ensures config.py and auth.py are importable from server.py
      PYTHONPATH: /app/backend
    depends_on:
      redis:
        condition: service_healthy
    command: >
      gunicorn
        --worker-class eventlet
        --workers 3
        --bind 0.0.0.0:5000
        --timeout 120
        --keep-alive 5
        --log-level info
        --access-logfile -
        --error-logfile -
        backend.server:app
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - meetfree

volumes:
  redis_data: