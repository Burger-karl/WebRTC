# nginx/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────
#  MeetFree Production Nginx Config
#  Handles: HTTPS termination, WebSocket upgrade, static file serving,
#           security headers, and upstream load balancing.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript;

    # ── Upstream (Gunicorn workers) ───────────────────────────
    upstream meetfree_app {
        # least_conn distributes WebSocket connections more evenly
        # than round-robin (long-lived connections can skew round-robin)
        least_conn;
        server meetfree:5000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ──────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name yourdomain.com;   # ← change to your domain

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # ── Security headers ───────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options           SAMEORIGIN         always;
        add_header X-Content-Type-Options    nosniff            always;
        add_header Referrer-Policy           strict-origin      always;
        # Allow camera, mic, screen share from same origin only
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)";

        # ── Static files (served by Nginx, not Python) ─────────
        location /style.css {
            root /app/frontend;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location /app.js {
            root /app/frontend;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # ── Socket.IO — WebSocket upgrade ──────────────────────
        # This is critical: without these headers, WebSocket connections
        # fall back to HTTP long-polling, which is much less efficient.
        location /socket.io/ {
            proxy_pass         http://meetfree_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;   # keep WebSocket connections alive
            proxy_buffering    off;
        }

        # ── All other requests → Flask ─────────────────────────
        location / {
            proxy_pass         http://meetfree_app;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;

            # Rate limit the token endpoint at the nginx level too
            # (belt-and-suspenders alongside the Python rate limiter)
        }

        # ── Health check (bypass rate limiting) ───────────────
        location /health {
            proxy_pass http://meetfree_app;
            access_log off;
        }
    }
}