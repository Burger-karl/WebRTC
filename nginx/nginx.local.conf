# nginx/nginx.local.conf
# ─────────────────────────────────────────────────────────────────────────────
#  MeetFree — LOCAL TESTING Nginx config (HTTP only, no SSL)
#  Use this file for local testing via Docker.
#  For production, use nginx.conf (HTTPS version).
#
#  To use: docker-compose -f docker-compose.local.yml up
# ─────────────────────────────────────────────────────────────────────────────

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile    on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript;

    upstream meetfree_app {
        least_conn;
        server meetfree:5000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Socket.IO WebSocket upgrade ────────────────────────
        location /socket.io/ {
            proxy_pass         http://meetfree_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;
            proxy_buffering    off;
        }

        # ── All other requests ─────────────────────────────────
        location / {
            proxy_pass        http://meetfree_app;
            proxy_http_version 1.1;
            proxy_set_header  Host            $host;
            proxy_set_header  X-Real-IP       $remote_addr;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass  http://meetfree_app;
            access_log  off;
        }
    }
}